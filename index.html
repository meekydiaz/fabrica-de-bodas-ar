<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu regalo especial</title>
<meta name="description" content="Un regalo te está esperando.">
<meta name="robots" content="noindex">
<style>
  :root{
    --carmin:#A02136; --carmin-osc:#5E0F1F; --carmin-prof:#3D0813;
    --oro:#FFCF2E; --oro-osc:#E0A800; --crema:#F7E9DC;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100svh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:26px; padding:44px 24px calc(44px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 0%, var(--carmin-osc) 0%, var(--carmin-prof) 62%, #240509 100%);
    color:var(--crema); text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  .logo{width:min(240px,60vw);height:auto;filter:drop-shadow(0 6px 22px rgba(0,0,0,.55))}
  h1{
    font-size:clamp(25px,6.4vw,37px); line-height:1.22; font-weight:800;
    letter-spacing:-.02em; max-width:15ch;
  }
  h1 span{color:var(--oro)}
  a.ar{
    display:block; width:min(290px,72vw); border-radius:26px; overflow:hidden;
    border:3px solid var(--oro); text-decoration:none;
    box-shadow:0 18px 46px rgba(0,0,0,.6); transition:transform .15s ease;
    animation:latido 2.6s ease-in-out infinite;
  }
  a.ar:active{transform:scale(.96)}
  a.ar img{display:block;width:100%;height:auto}
  @keyframes latido{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.035)}
  }
  @media (prefers-reduced-motion:reduce){ a.ar{animation:none} }
  .cta{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:17px; background:var(--oro); color:#2A1116;
    font-size:18px; font-weight:800;
  }
  .nota{font-size:13px;line-height:1.5;opacity:.5;max-width:32ch}
  .aviso{
    display:none; font-size:14px; line-height:1.5; padding:14px 18px; border-radius:14px;
    background:#00000045; border:1px solid #ffffff22; max-width:32ch;
  }
  html:not(.ios) .aviso{display:block}
  html:not(.ios) a.ar{opacity:.4; pointer-events:none; animation:none}
</style>
</head>
<body>

  <img class="logo" src="logo-fdb.png" alt="La Fábrica de Bodas">

  <h1>Toca este botón para recibir tu <span>regalo especial</span></h1>

  <a class="ar" rel="ar" href="modelos/celestino.usdz">
    <img src="regalo.jpg" alt="">
    <span class="cta">Abrir mi regalo</span>
  </a>

  <p class="aviso">Ábrelo desde un <strong>iPhone o iPad</strong> con Safari para poder recibirlo.</p>

  <p class="nota">La Fábrica de Bodas · Aldea Films</p>

<script>
  // Metodo oficial de Apple: preguntar si el navegador soporta enlaces AR
  var a = document.createElement('a');
  var soportaAR = a.relList && a.relList.supports && a.relList.supports('ar');
  if (soportaAR) document.documentElement.classList.add('ios');
</script>
</body>
</html>
